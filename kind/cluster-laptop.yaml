# PROFILE=laptop (scripts/lib/kc.sh): 1 control-plane + 2 workers instead of 3. Keycloak (2 pods/color, hard
# anti-affinity per node + zone spread) needs exactly 2 zones; Oracle is one instance, so it fits either. A third
# worker would only add node overhead. 1 worker would need the anti-affinity relaxed. Label
# kc-bluegreen/profile records the profile: check_profile refuses a run with another one.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kc
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      ingress-ready: "true"
      kc-bluegreen/profile: laptop
    extraPortMappings:
      - containerPort: 443
        hostPort: 443
        listenAddress: "127.0.0.1"
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      topology.kubernetes.io/zone: a
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      topology.kubernetes.io/zone: b
