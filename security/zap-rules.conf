# ZAP baseline rules for probe zap (zap-baseline.py -c). Tab-separated: <rule id>	<IGNORE|INFO|WARN|FAIL>	(<name>)
# Only known-acceptable alerts go here, each downgraded to INFO with a one-line justification above it.
# Still WARN on purpose (real hardening gaps): 10055 CSP without default-src/script-src, 10063 no Permissions-Policy.

# KC_AUTH_SESSION_HASH (60 s, no secret) is read by Keycloak's login JS for multi-tab login detection: not HttpOnly by design.
10010	INFO	(Cookie No HttpOnly Flag)
# Informational: Keycloak's console HTML and realm JSON send no-cache; no-store is used where it matters (login, tokens).
10015	INFO	(Re-examine Cache-control Directives)
# Only the ingress' own static 404 pages outside /keycloak (/, robots.txt, sitemap.xml); Keycloak pages carry a CSP.
10038	INFO	(Content Security Policy (CSP) Header Not Set)
# Informational: no-store on auth responses is intended.
10049	INFO	(Non-Storable Content)
# Keycloak sets SameSite=None on purpose: OIDC flows are cross-site (form_post, session iframe); all such cookies are Secure.
10054	INFO	(Cookie with SameSite Attribute None)
# Informational: the account/admin consoles are SPAs.
10109	INFO	(Modern Web Application)
# Informational: identifies session cookies, which probe cookies checks for flags.
10112	INFO	(Session Management Response Identified)
# COEP only matters for cross-origin isolation (SharedArrayBuffer etc.), which no Keycloak page uses.
90004	INFO	(Cross-Origin-Embedder-Policy Header Missing or Invalid)
