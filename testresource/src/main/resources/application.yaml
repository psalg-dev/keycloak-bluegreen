server:
  port: 8080
  # Behind ingress-nginx; trust X-Forwarded-* only from the pod subnet (see legacy-idp/application.yaml).
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: 10.244.0.0/16
      protocol-header: X-Forwarded-Proto

spring:
  ssl:
    bundle:
      pem:
        demo-ca: # Secret demo-ca mounted at /etc/demo-ca; trust for kc-netN.localtest.me
          truststore:
            certificate: file:/etc/demo-ca/ca.crt

demo:
  issuer: https://kc-{net}.localtest.me/keycloak/realms/demo
