apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kc
  namespace: keycloak
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k" # Keycloak's cookies/headers exceed nginx's 4k default
spec:
  ingressClassName: nginx
  tls:
    - hosts: [kc-net1.localtest.me, kc-net2.localtest.me]
      secretName: localtest-tls
  rules:
    - host: kc-net1.localtest.me
      http:
        paths:
          - path: /keycloak
            pathType: Prefix
            backend:
              service:
                name: kc-active
                port:
                  name: http
    - host: kc-net2.localtest.me
      http:
        paths:
          - path: /keycloak
            pathType: Prefix
            backend:
              service:
                name: kc-active
                port:
                  name: http
