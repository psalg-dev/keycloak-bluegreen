name: kc-bluegreen

services:
  launcher:
    build: images/launcher
    image: kc-bluegreen/launcher:local
    working_dir: /repo
    command: ["bash", "scripts/up.sh"]
    # 16 GB laptop: `PROFILE=laptop docker compose up launcher` (creates the cluster in that profile), then
    # `PROFILE=laptop docker compose run --rm launcher scripts/demo.sh all` (Jenkins: build parameter PROFILE=laptop).
    environment:
      PROFILE: ${PROFILE:-default}
      # Oracle image selection (19.3 EE needs the Oracle registry and a pull secret). Compose passes only what is
      # listed here, so an exported ORACLE_IMAGE would otherwise never reach the launcher.
      ORACLE_IMAGE: ${ORACLE_IMAGE:-gvenzl/oracle-free:23.26.3-slim}
      ORACLE_PULL_SECRET: ${ORACLE_PULL_SECRET:-}
      ORACLE_PULL_SECRET_FILE: ${ORACLE_PULL_SECRET_FILE:-}
      ORACLE_SID: ${ORACLE_SID:-}
      ORACLE_MEMORY: ${ORACLE_MEMORY:-2Gi}
      ORACLE_STORAGE: ${ORACLE_STORAGE:-20Gi}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/repo
      - kube:/root/.kube

  # Run `bash scripts/jenkins-secret.sh` before `docker compose up jenkins`: it generates the admin password
  # into out/jenkins-admin-password (compose cannot generate secrets). UI: http://localhost:8081, user admin.
  jenkins:
    build: images/jenkins
    image: kc-bluegreen/jenkins:local
    # ponytail: root, not jenkins (1000). docker.sock is root:root 660 on Docker Desktop and the shared kube
    # volume holds a root-only 600 kubeconfig written by the launcher. Mounting docker.sock is root on the
    # host anyway, so this adds no privilege. Switch to group_add + chown if the socket ever stops being root-equivalent.
    user: root
    # Jenkins' (safe) restart exits the process and expects a supervisor to start it again
    restart: unless-stopped
    ports:
      - 127.0.0.1:8081:8080
    environment:
      CASC_JENKINS_CONFIG: /repo/jenkins/casc.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/repo:ro
      - jenkins_home:/var/jenkins_home
      - kube:/root/.kube
    secrets:
      - jenkins-admin-password

volumes:
  kube: {}
  jenkins_home: {}

secrets:
  jenkins-admin-password:
    file: out/jenkins-admin-password
